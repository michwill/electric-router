# One workspace, three crates: the solver (this package), the EVM wrapper, and
# the wasm-bindgen module that carries both into a browser.  The resolver keeps
# `default-features = false` on a path dependency honest, so pyo3 really is
# excluded when the wasm crate is the one being built; `3` adds MSRV-aware
# version picking, which matters because the toolchain here is pinned.
[workspace]
members = ["evm", "wasm", "proto"]
resolver = "3"

[package]
name = "erouter-solve"
version = "0.1.0"
edition = "2024"
description = "The quadratic-flow router's hot path: active-set QP over a graph Laplacian."
license = "MIT"

[lib]
name = "erouter_solve"
# `cdylib` for the Python extension and for a bare wasm module; `rlib` so the
# core can be unit-tested and linked by a future JS-facing wrapper.
crate-type = ["cdylib", "rlib"]

[features]
# Section timers inside the pivot loop.  Native profiling only: it pulls in
# a clock, which the wasm/browser build must not have.
bench = []
default = []
# PyO3 is optional so the same core compiles to wasm32 with no Python at all.
python = ["dep:pyo3"]

# The pool models are 256-bit integer arithmetic on the admission path.
# `ruint` is no-std and has no build script, so it crosses to wasm32 with the
# rest of the crate.
[dependencies]
ruint = { version = "1", default-features = false }

[dependencies.pyo3]
version = "0.23"
features = ["extension-module", "abi3-py311"]
optional = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# `unwind`, deliberately.  With `abort` a panic anywhere in here -- a `None`
# unwrapped, an index off the end, a `U256` subtraction that borrows -- is
# SIGABRT, and the whole CPython process goes with it: PyO3 cannot turn a
# panic into an exception it never gets to see.  Unwinding costs 6% of the
# pivot loop and nothing measurable on the pool models (docs/performance.md),
# which is what a router that stays up is worth.  wasm32 cannot unwind at all,
# so the browser build has no such net -- see `rust/README.md`.
panic = "unwind"
